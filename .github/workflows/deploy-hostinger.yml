name: Deploy marrydj.com to Hostinger

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: marrydj-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: cms_phase1_test
          # Disposable CI fixture only; never a hosting or production credential.
          MYSQL_ROOT_PASSWORD: ci-fixture-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Validate website and deployment list
        run: |
          python3 tools/deploy_hostinger.py --check
          python3 -m unittest discover -s tools -p 'test_deploy_hostinger.py'
          node --check script.js
          node --check translations.js
          node tools/check-site.cjs
          php -l send-offer.php
          php -l whatsapp-notify.php
          php -l admin/core.php
          php -l admin/index.php
          php -l tools/cms_create_admin.php
          php tools/test_cms.php

      - name: Test CMS against disposable MySQL (never Hostinger)
        env:
          CMS_TEST_DATABASE: '1'
          CMS_DB_HOST: 127.0.0.1
          CMS_DB_NAME: cms_phase1_test
          CMS_DB_USER: root
          CMS_DB_PASSWORD: ci-fixture-only
          CMS_APP_KEY: ci-test-key-not-a-production-secret-0000
        run: |
          php tools/test_cms.php
          python3 tools/test_cms_http.py

      - name: Upload and verify only the allowed production files
        env:
          HOSTINGER_FTPS_HOST: ${{ secrets.HOSTINGER_FTPS_HOST }}
          HOSTINGER_FTPS_IP: ${{ secrets.HOSTINGER_FTPS_IP }}
          HOSTINGER_FTPS_USER: ${{ secrets.HOSTINGER_FTPS_USER }}
          HOSTINGER_FTPS_PASSWORD: ${{ secrets.HOSTINGER_FTPS_PASSWORD }}
        run: python3 tools/deploy_hostinger.py --deploy
